project:
  type: website
  render:
    - "*.qmd"

website:
  title: My Presentations
  description: My Presentations
  site-path: ./
  site-url: https://adafede.github.io/my-presentations
  repo-url: https://github.com/adafede/my-presentations
  search:
    location: navbar
  open-graph:
    locale: en
    site-name: https://adafede.github.io/my-presentations
  navbar: true

format:
  html:
    grid:
      body-width: 1200px
    link-external-newwindow: true
    theme:
      light: flatly
      dark: darkly
    respect-user-color-scheme: true
    smooth-scroll: true
