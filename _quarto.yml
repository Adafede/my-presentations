---
project:
  type: website
  render:
    - "*.qmd"

website:
  title: My Presentations
  description: My Presentations
  site-path: ./
  site-url: https://adafede.github.io/my-presentations
  repo-url: https://github.com/adafede/my-presentations
  search:
    location: navbar
  navbar:
    right:
      - text: "![](https://codeberg.org/Codeberg/Design/raw/branch/main/logo/icon/svg/codeberg-logo_icon_white.svg)"
        aria-label: Codeberg
        href: https://codeberg.org/adafede/pages/my-presentations
  body-header: |
    <!-- 100% privacy-first analytics -->
    <script async src="https://scripts.simpleanalyticscdn.com/latest.js"></script>
  page-footer: |
    <div style="display: flex; justify-content: center;">
    <a href="https://www.simpleanalytics.com?utm_source=adafede.github.io&utm_content=badge" referrerpolicy="origin" target="_blank" rel="noopener noreferrer">
      <picture>
        <source
          srcset="https://simpleanalyticsbadges.com/adafede.github.io?mode=dark&counter=false&radius=10&background-dark=0a0f19&text-dark=b8c5d6&logo-dark=d69999"
          media="(prefers-color-scheme: dark)"
        />
        <img
          src="https://simpleanalyticsbadges.com/adafede.github.io?mode=light&counter=false&radius=10&background-light=f7fafc&text-light=4a5a6d&logo-light=990000"
          alt="Simple Analytics"
          width="118"
          height="28"
          loading="lazy"
          referrerpolicy="no-referrer"
          crossorigin="anonymous"
        />
      </picture>
    </a>
    </div>
  open-graph:
    locale: en
    site-name: https://adafede.github.io/my-presentations

format:
  html:
    grid:
      body-width: 1200px
    link-external-newwindow: true
    respect-user-color-scheme: true
    smooth-scroll: true

kernel: .venv
